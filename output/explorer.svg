<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="379" viewBox="0 0 1000 379"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="repository_explorer">
  <style>
    text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

    .in    { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); }
                      to   { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

    .pulse { transform-origin: center; transform-box: fill-box;
             animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }

    .sheen { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-1100px); }
                       85%, 100% { transform: translateX(1100px); } }

    .frame-in { opacity: 0; transform-origin: center; transform-box: fill-box;
                animation: frame .9s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes frame { from { opacity: 0; transform: scale(.975) translateY(6px); }
                       to   { opacity: 1; transform: scale(1) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .frame-in { animation: none; opacity: 1; }
      .sheen { animation: none; opacity: 0; }
    }
    </style>
  <defs>
    <linearGradient id="bgexp" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#08080C"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glexp" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#E5484D" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cpexp"><rect width="1000" height="379" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cpexp)">
    <rect width="1000" height="379" fill="url(#bgexp)"/>
    <rect width="1000" height="379" fill="url(#glexp)"/>
    <text class="mono" x="30" y="27.5" font-size="12" letter-spacing="1.5"
          fill="#8B8B98"><tspan fill="#E5484D">&#9656;</tspan>  repository_explorer</text>
    <text class="mono" x="970" y="27.5" text-anchor="end"
          font-size="11.5" fill="#55555F">~/projects</text>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <line x1="330" y1="46" x2="330" y2="339" stroke="#FFFFFF" stroke-opacity="0.05"/><text class="in mono" style="animation-delay:.25s" x="44" y="90" font-size="12.5" fill="#8B8B98"><tspan fill="#E5484D">&#9662;</tspan>  ~/projects</text><text class="in mono" style="animation-delay:0.40s" x="48" y="117" font-size="12.5" fill="#55555F">&#9500;&#9472;&#9472; CourseTide</text><text class="in mono" style="animation-delay:0.54s" x="48" y="144" font-size="12.5" fill="#55555F">&#9500;&#9472;&#9472; WaifuPuller</text><text class="in mono" style="animation-delay:0.68s" x="48" y="171" font-size="12.5" fill="#55555F">&#9500;&#9472;&#9472; student-management-system</text><text class="in mono" style="animation-delay:0.82s" x="48" y="198" font-size="12.5" fill="#55555F">&#9500;&#9472;&#9472; Portfolio_Version2</text><text class="in mono" style="animation-delay:0.96s" x="48" y="225" font-size="12.5" fill="#55555F">&#9500;&#9472;&#9472; My-site</text><text class="in mono" style="animation-delay:1.10s" x="48" y="252" font-size="12.5" fill="#55555F">&#9500;&#9472;&#9472; my-works-3</text><text class="in mono" style="animation-delay:1.24s" x="48" y="279" font-size="12.5" fill="#55555F">&#9500;&#9472;&#9472; my-works-1</text><g class="in" style="animation-delay:1.38s"><rect x="32" y="291" width="266" height="24" rx="7" fill="#E5484D" opacity="0.09"/><rect x="32" y="294" width="2.5" height="18" rx="1.25" fill="#E5484D"/><text class="mono" x="48" y="306" font-size="12.5" fill="#EDEDF2">&#9492;&#9472;&#9472; my-works-2</text></g><text class="in" style="animation-delay:0.75s" x="372" y="98" font-size="21" font-weight="650" letter-spacing="0.3" fill="#EDEDF2">my-works-2</text><g class="in" style="animation-delay:0.85s"><rect x="514" y="81" width="77" height="22" rx="11" fill="#101018" stroke="#FFFFFF" stroke-opacity="0.09"/><circle class="pulse" cx="527" cy="92" r="2.8" fill="#46C88C"/><text class="mono" x="537" y="96" font-size="10" letter-spacing="1" fill="#8B8B98">dormant</text></g><text class="in" style="animation-delay:0.93s" x="372" y="130" font-size="13.5" fill="#8B8B98">no description set on this repository</text><g class="in" style="animation-delay:1.20s"><rect x="372" y="152" width="52" height="24" rx="12" fill="#101018" stroke="#E5484D" stroke-opacity="0.22"/><text class="mono" x="398.0" y="168" text-anchor="middle" font-size="10.5" fill="#8B8B98">HTML</text></g><text class="in mono" style="animation-delay:1.45s" x="372" y="207" font-size="11" letter-spacing="0.5" fill="#55555F">type: html   ·   since 2025   ·   ★ 0</text>
    <line x1="0" y1="339" x2="1000" y2="339" stroke="#FFFFFF" stroke-opacity="0.05"/><text class="mono" x="500.0" y="363" text-anchor="middle" font-size="10" letter-spacing="1" fill="#55555F">12 public repositories · ★ 0 collected · 3 followers · featured rotates daily</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="378" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>