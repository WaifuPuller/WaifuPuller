<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="108" viewBox="0 0 1000 108"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="contact">
  <style>
    text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

    .in    { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); }
                      to   { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

    .pulse { transform-origin: center; transform-box: fill-box;
             animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }

    .sheen { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-1100px); }
                       85%, 100% { transform: translateX(1100px); } }

    .frame-in { opacity: 0; transform-origin: center; transform-box: fill-box;
                animation: frame .9s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes frame { from { opacity: 0; transform: scale(.975) translateY(6px); }
                       to   { opacity: 1; transform: scale(1) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .frame-in { animation: none; opacity: 1; }
      .sheen { animation: none; opacity: 0; }
    }
    </style>
  <defs>
    <linearGradient id="bgeof" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#08080C"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <clipPath id="cpeof"><rect width="1000" height="108" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cpeof)">
    <rect width="1000" height="108" fill="url(#bgeof)"/>
    <text class="in mono" style="animation-delay:.15s" x="44" y="34" font-size="12.5"
          fill="#8B8B98"><tspan fill="#E5484D">$</tspan> contact --open</text>
    <g class="in" style="animation-delay:0.30s"><rect x="44" y="53.0" width="199" height="28" rx="14" fill="#101018" stroke="#FFFFFF" stroke-opacity="0.09"/><text class="mono" x="61" y="71.0" font-size="11" fill="#8B8B98"><tspan fill="#E5484D">mail</tspan>: flash6027@gmail.com</text></g><g class="in" style="animation-delay:0.42s"><rect x="255" y="53.0" width="232" height="28" rx="14" fill="#101018" stroke="#FFFFFF" stroke-opacity="0.09"/><text class="mono" x="272" y="71.0" font-size="11" fill="#8B8B98"><tspan fill="#E5484D">github</tspan>: github.com/WaifuPuller</text></g><g class="in" style="animation-delay:0.54s"><rect x="499" y="53.0" width="384" height="28" rx="14" fill="#101018" stroke="#FFFFFF" stroke-opacity="0.09"/><text class="mono" x="516" y="71.0" font-size="11" fill="#8B8B98"><tspan fill="#E5484D">linkedin</tspan>: www.linkedin.com/in/aaditya-singh-408968357</text></g>
    <text class="mono" x="970" y="88" text-anchor="end" font-size="10"
          letter-spacing="1.5" fill="#55555F">EOF · arlecchino_os</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="107" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>