projects:
  - name: tide-forecast
    type: research
    since: 2025
    status: published
    desc: >-
      Coastal flood prediction from tide gauges and satellite
      altimetry, running two weeks ahead of the storm.
    stack: [Python, JAX, xarray]
  - name: field-notebook
    type: tooling
    since: 2024
    status: maintained
    desc: >-
      A notebook environment for fieldwork with no reliable
      internet — syncs when it can, never blocks when it cannot.
    stack: [Rust, SQLite, Svelte]
  - name: honest-charts
    type: library
    since: 2023
    status: stable
    desc: >-
      Plotting defaults that refuse to mislead. Truncated axes
      require an explicit argument and a small apology.
    stack: [TypeScript, D3]

