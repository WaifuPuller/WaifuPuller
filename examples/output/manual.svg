<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="310" viewBox="0 0 1000 310"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="readme">
  <style>
    text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

    .in    { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); }
                      to   { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

    .pulse { transform-origin: center; transform-box: fill-box;
             animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }

    .sheen { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-1100px); }
                       85%, 100% { transform: translateX(1100px); } }

    .frame-in { opacity: 0; transform-origin: center; transform-box: fill-box;
                animation: frame .9s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes frame { from { opacity: 0; transform: scale(.975) translateY(6px); }
                       to   { opacity: 1; transform: scale(1) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .frame-in { animation: none; opacity: 1; }
      .sheen { animation: none; opacity: 0; }
    }
    </style>
  <defs>
    <linearGradient id="bgman" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>
    <radialGradient id="glman" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#3BA9C8" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#3BA9C8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cpman"><rect width="1000" height="310" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cpman)">
    <rect width="1000" height="310" fill="url(#bgman)"/>
    <rect width="1000" height="310" fill="url(#glman)"/>
    <text class="mono" x="30" y="27.5" font-size="12" letter-spacing="1.5"
          fill="#7F91A6"><tspan fill="#3BA9C8">&#9656;</tspan>  readme</text>
    <text class="mono" x="970" y="27.5" text-anchor="end"
          font-size="11.5" fill="#4A5768">readme(1)</text>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text class="in mono" style="animation-delay:0.20s" x="44" y="92" font-size="11.5" font-weight="700" letter-spacing="2" fill="#3BA9C8">ABSTRACT</text><text class="in mono" style="animation-delay:0.30s" x="88" y="116" font-size="12.5" fill="#7F91A6">Studies coastlines and the models that fail to predict them.</text><text class="in mono" style="animation-delay:0.36s" x="44" y="153" font-size="11.5" font-weight="700" letter-spacing="2" fill="#3BA9C8">METHOD</text><text class="in mono" style="animation-delay:0.46s" x="88" y="177" font-size="12.5" fill="#7F91A6">Collect carefully. Plot before modelling. Distrust any result</text><text class="in mono" style="animation-delay:0.52s" x="88" y="198" font-size="12.5" fill="#7F91A6">that arrives on the first attempt.</text><text class="in mono" style="animation-delay:0.58s" x="44" y="235" font-size="11.5" font-weight="700" letter-spacing="2" fill="#3BA9C8">BIAS</text><text class="in mono" style="animation-delay:0.68s" x="88" y="259" font-size="12.5" fill="#7F91A6">Prefers a boring model that holds to a clever one that does not.</text>
    
  </g>
  <rect x="0.5" y="0.5" width="999" height="309" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>